{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Academia Verde — Directorio de Cursos{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body data-page="{% block page_name %}inicio{% endblock %}">

  <nav class="navbar">
    <div class="navbar__inner">
      <a class="brand" href="{% url 'inicio' %}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 10L12 5 2 10l10 5 10-5z"/>
          <path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/>
        </svg>
        Academia Verde
      </a>
      <div class="navbar__links">
        <a href="{% url 'inicio' %}">Inicio</a>
        <a href="{% url 'inicio' %}#cursos">Cursos</a>
        <a href="/admin/" target="_blank" class="badge">Panel Admin</a>
      </div>
    </div>
  </nav>

  {% block content %}
  {% endblock %}

  <footer class="footer">
    <p><strong>Academia Verde</strong> — Directorio de Cursos · Proyecto académico Django (Evaluación 1)</p>
  </footer>

</body>
</html>
