{% extends "admin/index.html" %}
{% load i18n static %}

{% block content %}
<div style="background: #ffffff; border: 1px solid #e2e8f0; border-left: 4px solid #059669; border-radius: 10px; padding: 16px 20px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.05);">
  <div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px;">API RESTful v1</span>
      <strong style="color: #064e3b; font-size: 1rem;">Servicio Web y Endpoints DRF</strong>
    </div>
    <p style="margin: 4px 0 0 0; color: #64748b; font-size: 0.85rem;">
      Endpoints de datos estructurados con Django REST Framework y autenticación stateless Simple JWT.
    </p>
  </div>
  <div style="display: flex; gap: 10px; flex-wrap: wrap;">
    <a href="/api/v1/cursos/" target="_blank" style="background: #059669; color: #ffffff; padding: 8px 15px; border-radius: 6px; font-weight: 600; font-size: 0.84rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.08);">
      <span>Abrir API Navegable (DRF)</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    </a>
    <a href="{% url 'catalogo_api' %}" target="_blank" style="background: #f8fafc; color: #334155; border: 1px solid #cbd5e1; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 0.84rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
      <span>Ver Catálogo Dinámico</span>
    </a>
  </div>
</div>

{{ block.super }}
{% endblock %}
